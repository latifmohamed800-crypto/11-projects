name: Build LATIF BOOK Z v2 APK

on:
  push:
    branches:
      - latif-book-z-v2-build
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack mobile source
        run: |
          mkdir -p latif-book-z-v2
          unzip -q latif-book-z-v2/mobile-build.zip -d latif-book-z-v2
          mv latif-book-z-v2/mobile_build latif-book-z-v2/mobile
          test -f latif-book-z-v2/mobile/package.json

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install JS dependencies
        working-directory: latif-book-z-v2/mobile
        run: npm install

      - name: Expo prebuild
        working-directory: latif-book-z-v2/mobile
        run: npx expo prebuild --clean --platform android --non-interactive

      - name: Build debug APK
        working-directory: latif-book-z-v2/mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp latif-book-z-v2/mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/LATIF-BOOK-Z-v2.0.0-debug.apk
          sha256sum dist/LATIF-BOOK-Z-v2.0.0-debug.apk > dist/LATIF-BOOK-Z-v2.0.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LATIF-BOOK-Z-v2.0.0-APK
          path: dist/*
          if-no-files-found: error
